name: test

on:
  push:
    branches: [main]   # 其他分支開 PR 時由 pull_request 跑，不重複跑兩次
  pull_request:

permissions:
  contents: read   # 只跑測試，不需要寫入權限

jobs:
  pytest:
    # 程式只支援 Windows（ctypes.windll、具名 mutex 等），使用者也只有 Windows
    runs-on: windows-latest
    timeout-minutes: 30   # 測試卡住時，不要等預設的 6 小時
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python 版本讀 .python-version；--locked：uv.lock 和 pyproject.toml 對不上就失敗
      - run: uv sync --locked --group test
      - run: uv run pytest
